# Runs the whole stack: PostgreSQL, the API and the web app (served by nginx).
#   cp .env.example .env    # then edit secrets
#   docker compose up --build -d
#   docker compose exec api node dist/db/seed.js   # first admin
# Open http://localhost:8080

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadtracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-leadtracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leadtracker} -d ${POSTGRES_DB:-leadtracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-leadtracker}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-leadtracker}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      # Keep true when served over HTTPS. Set COOKIE_SECURE=false in .env only to try the stack on plain http://localhost.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
